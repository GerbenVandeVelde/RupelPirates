name: Update klassement

on:
  schedule:
    # Om de 6 uur (UTC). GitHub kan een cron-run een paar minuten uitstellen bij drukte.
    - cron: '0 */6 * * *'
  workflow_dispatch: {}   # laat toe om de run ook manueel te starten via de Actions-tab

permissions:
  contents: write   # nodig om data.json terug te committen naar de repo

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: python scraper_klassement.py
        # Als de site onbereikbaar is of veel minder ploegen oplevert dan verwacht,
        # stopt scraper_klassement.py zelf met een foutcode en wordt data.json NIET aangepast
        # — deze stap (en dus de job) faalt dan bewust, zodat je een mislukte run ziet in de Actions-tab.

      - name: Commit en push data.json indien gewijzigd
        run: |
          if git diff --quiet -- data.json; then
            echo "Geen wijzigingen in data.json — niets te committen."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "chore: automatische update klassement [skip ci]"
          git push
